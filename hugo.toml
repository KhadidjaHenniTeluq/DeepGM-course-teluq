baseURL = 'https://khadidjahenniteluq.github.io/DeepGM-course-teluq/'
title = 'Modèles génératifs profonds'
theme = 'hugo-book'
languageCode = 'fr-ca'
defaultContentLanguage = 'fr'

disablePathToLower = true
enableGitInfo = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  BookTheme = 'auto'
  BookToC = true
  BookSection = 'docs'
  BookSearch = true
  BookComments = false
  BookPortableLinks = false
  BookServiceWorker = false
  BookDateFormat = '2 January 2006'
  BookLogo = 'logo.svg'
  Auteure = 'Khadidja Henni'
