- q: 'Dans un LDM, la diffusion est appliquée :'
  options:
  - directement aux étiquettes seulement
  - dans l’espace latent appris par l’autoencodeur
  - uniquement dans l’espace RGB
  - sur la fonction de partition
  answer: 1
  explanation: Le cœur du LDM est la diffusion dans une représentation compressée.
- q: 'L’appariement de flot apprend principalement :'
  options:
  - un champ de vitesse dépendant du temps
  - un discriminateur binaire
  - une énergie non normalisée
  - une loi a posteriori $q(z \mid x)$
  answer: 0
  explanation: Le réseau approxime la vitesse qui transporte une distribution vers une autre.
- q: Quelle distinction est la plus correcte ?
  options:
  - L’appariement de flot est toujours une SDE
  - L’appariement de flot est formulé comme une ODE de transport, tandis que la diffusion est souvent introduite via un processus stochastique
  - La diffusion et l’appariement de flot sont identiques
  - L’appariement de flot ne peut pas utiliser de chemins liés à la diffusion
  answer: 1
  explanation: L’appariement de flot est une régression de champ de vitesse pour une dynamique ODE ; des chemins de diffusion peuvent néanmoins être utilisés.
- q: 'Les lois d’échelle sont :'
  options:
  - des théorèmes universels exacts
  - des relations empiriques observées entre performance et ressources
  - une perte de diffusion
  - des règles de production du RHM
  answer: 1
  explanation: Elles résument des tendances empiriques et dépendent du régime, des données et de l’architecture.
- q: 'Un « modèles génératifs de fondation » est typiquement :'
  options:
  - Un modèle sans aucun paramètre appris
  - Un petit modèle entraîné pour une seule tâche
  - Un modèle qui ne peut pas être conditionné
  - Un grand modèle pré-entraîné sur de vastes données, adaptable à de nombreuses tâches
  answer: 3
  explanation: 'Pré-entraînement massif puis adaptation (conditionnement, ajustement fin) : ce compromis a un coût, d''où la question « faut-il toujours l''utiliser ? ».'
